name: SDK Core CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # sccache cannot cache incremental compiles, and nothing in CI reads
  # debug info. Both settings make the dev build smaller and cacheable.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  validate-pr:
    name: Validate pull request
    runs-on: ubuntu-latest
    env:
      RUSTC_WRAPPER: sccache
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Configure compiler cache backend
        # The GitHub Actions cache is scoped per branch, so every pull request
        # starts cold. A Cloudflare R2 bucket (S3-compatible) is shared across
        # all branches. Fall back to the Actions cache when the bucket is not
        # configured, for example on pull requests from forks.
        env:
          R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ vars.SCCACHE_BUCKET }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ]; then
            {
              echo "SCCACHE_BUCKET=$R2_BUCKET"
              echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
              echo "SCCACHE_REGION=auto"
              echo "SCCACHE_S3_KEY_PREFIX=sdk-core/${RUNNER_OS}-${RUNNER_ARCH}"
              echo "AWS_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID"
              echo "AWS_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY"
            } >> "$GITHUB_ENV"
            echo "Compiler cache: R2 bucket $R2_BUCKET"
          else
            echo "SCCACHE_GHA_ENABLED=true" >> "$GITHUB_ENV"
            echo "Compiler cache: GitHub Actions cache (R2 not configured)"
          fi

      - name: Setup shared compiler cache
        uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked

      - name: Test
        run: cargo test --all-features --locked

      - name: Verify crates.io package
        run: cargo publish --dry-run --locked

      - name: Show sccache stats
        if: always()
        run: sccache --show-stats
