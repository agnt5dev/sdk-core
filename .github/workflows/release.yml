name: SDK Core Release

# Runs only when a GitHub release is published. There is intentionally no
# manual trigger: cut a release from the GitHub UI or `gh release create` with
# a `vX.Y.Z` tag that matches Cargo.toml and this workflow publishes the crate.
# Pull request validation lives in ci.yml.
on:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Read and validate version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Cargo.toml package version must be x.y.z: $VERSION" >&2
            exit 1
          fi
          if [ "$RELEASE_TAG" != "v${VERSION}" ]; then
            echo "Release tag $RELEASE_TAG does not match Cargo.toml version v${VERSION}" >&2
            exit 1
          fi
          if [ "$RELEASE_PRERELEASE" = true ]; then
            echo "Stable crate $VERSION cannot be published from a GitHub prerelease" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Lint
        run: cargo clippy --all-targets --all-features --locked

      - name: Test
        run: cargo test --all-features --locked

      - name: Verify crates.io package
        run: cargo publish --dry-run --locked

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Output release summary
        run: |
          {
            echo "## SDK Core Release"
            echo "**Crate:** \`agnt5-sdk-core\`"
            echo "**Version:** \`v${{ steps.version.outputs.version }}\`"
            echo "**Release:** ${{ github.event.release.html_url }}"
            echo "**Commit:** \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
